# pnpm supply-chain hardening.
#
# pnpm reads its settings from this file (v10.16+ moved them out of package.json's
# `pnpm.*` field and .npmrc). This repo is a single package, so there are no
# workspace `packages:` globs. Requires pnpm >= 11 (see packageManager in
# package.json) — several keys below (allowBuilds, blockExoticSubdeps,
# trustPolicyIgnoreAfter) do not exist in older pnpm and would be silently ignored.

# Cooldown: refuse to install any version published less than 5 days (7200 min) ago.
# Blunts the window in which a freshly-published, compromised release can reach us.
minimumReleaseAge: 7200

# Build/lifecycle scripts are blocked by default. Allow only packages we've vetted.
# esbuild's postinstall links its prebuilt platform binary and is required by Vite;
# nothing else in the toolchain runs an install script.
allowBuilds:
  esbuild: true

# Fail the install if any *other* dependency ships an un-vetted build script instead
# of silently ignoring it — forces a conscious decision to add it to allowBuilds.
strictDepBuilds: true

# Reject git/tarball/other non-registry sub-dependencies sneaking into the graph.
blockExoticSubdeps: true

# Fail (never silently downgrade) if a package's trust level drops between installs;
# re-evaluate a flagged package after 30 days (43200 min).
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200

# Before running any package script (build/test/lint/…), verify node_modules matches
# the lockfile; error out rather than run against a stale/tampered tree.
verifyDepsBeforeRun: error
